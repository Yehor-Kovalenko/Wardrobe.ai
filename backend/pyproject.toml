[project]
name = "wardrobe-ai-backend"
version = "1.2.0"
description = "Wardrobe AI - Backend API"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.19.0",
    "alembic>=1.13.1",
    "apscheduler>=3.10.4",
    "arq>=0.25.0",
    "asyncpg>=0.29.0",
    "email-validator>=2.1.0",
    "fastapi>=0.109.0",
    "httpx>=0.26.0",
    "imagehash>=4.3.1",
    "pillow>=10.2.0",
    "pillow-heif>=0.14.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "pyjwt[crypto]>=2.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "python-dateutil>=2.8.2",
    "python-multipart>=0.0.6",
    "redis>=5.0.1",
    "sqlalchemy[asyncio]>=2.0.25",
    "tenacity>=8.2.3",
    "uvicorn[standard]>=0.27.0",
    "watchfiles>=0.21.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
